[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "efe-ui"
dynamic = ["version"]
description = "Graphical User Interface for controlling EFE1201 boards"
readme = "README.md"
authors = [
    { name = "Dolvac Instruments", email = "contact@dolvac.com" }
]
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "pyside6>=6.8",
    "zeroconf>=0.150.0",
]

[project.scripts]
efe-ui = "efe_ui.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0-dev"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "ANN"]
